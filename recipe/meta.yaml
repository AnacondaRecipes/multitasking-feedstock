{% set name = "multitasking" %}
{% set version = "0.0.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 2fba2fa8ed8c4b85e227c5dd7dc41c7d658de3b6f247927316175a57349b84d1

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python
    - setuptools
    - wheel
  run:
    - python

test:
  imports:
    - multitasking
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
  requires:
    - pip

about:
  home: https://github.com/ranaroussi/multitasking
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE.txt
  summary: Non-blocking Python methods using decorators
  description: |
    MultiTasking is a tiny Python library lets you convert your Python methods
    into asynchronous, non-blocking methods by using a aimple decorator.
  doc_url: https://github.com/ranaroussi/multitasking/blob/master/README.rst
  dev_url: https://github.com/ranaroussi/multitasking

extra:
  recipe-maintainers:
    - kc
